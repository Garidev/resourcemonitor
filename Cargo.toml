[package]
name = "resmon"
version = "1.0.0"
edition = "2021"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
serde_json = "1"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Ioctl", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_Etw", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_Security", "Win32_System_Time", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Performance", "Win32_Graphics_Dwm", "Win32_System_Com", "Win32_Media_Audio", "Win32_System_Pipes", "Win32_Security_Authorization"] }

[[bin]]
name = "resmon"
path = "src/main.rs"

[[bin]]
name = "resmon-mcp"
path = "src/bin/mcp.rs"
